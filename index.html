<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo LoRa - Solo Datos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 6px solid #22c55e;
        }
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        .metric {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric .value {
            font-size: 2.3rem;
            font-weight: bold;
            color: #22c55e;
        }
    </style>
</head>
<body>

    <h1>📡 Monitoreo de Paquetes LoRa</h1>
    <p class="subtitle">Panel de Control General (Sin mapas)</p>

    <div id="dashboard">
        <div class="card">
            <h2>🟢 NODO: GABRIEL</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-gabriel">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #a855f7;">
            <h2>🟢 NODO: JIMMY LORA 32</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-jimmy" style="color: #a855f7;">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #f97316;">
            <h2>🟢 NODO: AUGUSTO HELTEC</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-augusto" style="color: #f97316;">0</span>
            </div>
        </div>
    </div>

    <script>
        // Función extractora: saca el número de paquete sin importar el formato de TagoIO
        function procesarDatoTago(nodo) {
            if (!nodo) return '0';
            
            // 1. Si TagoIO manda el número directo (ej: "paquetes": "193")
            if (nodo.paquetes !== undefined && nodo.paquetes !== "") return nodo.paquetes;
            
            // 2. Extrae el texto donde sea que TagoIO guarde la cadena
            const textoCualquiera = nodo.estado || nodo.info || nodo.datos || '';
            
            // 3. Si viene la cadena exacta de Tago "Sensor=Activo,Paquete=193"
            const regexPaquete = textoCualquiera.match(/Paquete=(\d+)/);
            if (regexPaquete) return regexPaquete[1];
            
            // 4. Si viene solo un número suelto dentro del texto
            const regexNumeroSuelto = textoCualquiera.match(/\d+/);
            return regexNumeroSuelto ? regexNumeroSuelto[0] : '0';
        }

        async function solicitarDatos() {
            try {
                // Forzamos la actualización del JSON ignorando la caché del navegador
                const res = await fetch('./datos.json?nocache=' + new Date().getTime());
                const info = await res.json();

                // Mapeo flexible buscando por llaves (minúsculas, mayúsculas y nombres genéricos)
                const g = info.Gabriel || info.GABRIEL || info.lora1;
                const j = info.JimmyLora32 || info.lora2;
                const a = info.AUGUSTO_HELTEC || info.lora3;

                // Inyectamos el valor procesado en cada tarjeta
                document.getElementById('p-gabriel').innerText = procesarDatoTago(g);
                document.getElementById('p-jimmy').innerText = procesarDatoTago(j);
                document.getElementById('p-augusto').innerText = procesarDatoTago(a);
            } catch (err) {
                console.log("Esperando tramas válidas desde TagoIO...");
            }
        }

        solicitarDatos();
        // Actualización en tiempo real ultra rápida cada 2.5 segundos
        setInterval(solicitarDatos, 2500);
    </script>
</body>
</html>
