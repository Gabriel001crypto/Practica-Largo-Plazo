<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo LoRa - Paquetes en Tiempo Real</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        #sidebar {
            width: 320px;
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        #sidebar h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .dispositivo-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #38bdf8;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nodo-gabriel {
            border-left-color: #22c55e;
            background-color: #0f172a;
        }

        .dispositivo-card h3 {
            font-size: 1rem;
            color: #38bdf8;
        }

        .nodo-gabriel h3 {
            color: #22c55e;
        }

        .dispositivo-card p {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .packet-count {
            font-size: 1.4rem !important;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }

        #map-container {
            flex-grow: 1;
            height: 100%;
        }

        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Nodos Activos LoRa</h2>
        
        <div class="dispositivo-card nodo-gabriel">
            <h3>📡 NODO: GABRIEL</h3>
            <p>Paquetes Recibidos:</p>
            <p class="packet-count" id="p-gabriel">0</p>
        </div>

        <div class="dispositivo-card" style="border-left-color: #a855f7;">
            <h3>📡 NODO: JIMMY LORA 32</h3>
            <p>Paquetes Recibidos:</p>
            <p class="packet-count" id="p-jimmy">0</p>
        </div>

        <div class="dispositivo-card" style="border-left-color: #f97316;">
            <h3>📡 NODO: AUGUSTO HELTEC</h3>
            <p>Paquetes Recibidos:</p>
            <p class="packet-count" id="p-augusto">0</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="https://maps.google.com/maps?q=$?ll=-2.9001,-79.0045&z=16&output=embed"></iframe>
    </div>

    <script>
        // Función para extraer números de paquetes si vienen dentro de cadenas largas de texto
        function extraerPaquete(objetoNodo) {
            if (!objetoNodo) return '0';
            if (objetoNodo.paquetes) return objetoNodo.paquetes;
            
            // Si el dato viene metido en el campo de estado o info (Ej: "Paquete=193")
            const textoBuscar = objetoNodo.estado || objetoNodo.info || '';
            const coincidencia = textoBuscar.match(/Paquete=(\d+)/);
            return coincidencia ? coincidencia[1] : '0';
        }

        async function obtenerPaquetes() {
            try {
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime());
                const datos = await respuesta.json();
                
                // Buscamos los datos sin importar si TagoIO escribe en mayúsculas o minúsculas
                const nodoGabriel = datos.Gabriel || datos.GABRIEL;
                const nodoJimmy = datos.JimmyLora32 || datos.lora2;
                const nodoAugusto = datos.AUGUSTO_HELTEC || datos.lora3;

                document.getElementById('p-gabriel').innerText = extraerPaquete(nodoGabriel);
                document.getElementById('p-jimmy').innerText = extraerPaquete(nodoJimmy);
                document.getElementById('p-augusto').innerText = extraerPaquete(nodoAugusto);

            } catch (error) {
                console.error("Esperando transmisión de datos LoRa válida...", error);
            }
        }

        obtenerPaquetes();
        setInterval(obtenerPaquetes, 3000);
    </script>
</body>
</html>
