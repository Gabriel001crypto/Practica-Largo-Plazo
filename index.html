<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Nodos IoT - Capa de Aplicación</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* Panel Lateral */
        #sidebar {
            width: 300px;
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        #sidebar h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
        }

        .dispositivo-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dispositivo-card:hover {
            background-color: #475569;
        }

        .dispositivo-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .dispositivo-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        /* Contenedor del Mapa */
        #map-container {
            flex-grow: 1;
            height: 100%;
        }

        /* Estilo del iframe para ocupar toda la pantalla */
        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Dispositivos Activos</h2>
        
        <div class="dispositivo-card" onclick="cambiarUbicacion('-0.1807,-78.4678', 'mapa')">
            <h3>LORA 1 (Ver Mapa)</h3>
            <p>Ubicación: Centro</p>
        </div>

        <div class="dispositivo-card" onclick="cambiarUbicacion('-0.1807,-78.4678', 'streetview')">
            <h3>LORA 1 (Ver Street View)</h3>
            <p>Vista de calle interactiva</p>
        </div>

        <div class="dispositivo-card" onclick="cambiarUbicacion('-0.1900,-78.4700', 'mapa')">
            <h3>LORA 2 (Ver Mapa)</h3>
            <p>Ubicación: Norte</p>
        </div>

        <div class="dispositivo-card" onclick="cambiarUbicacion('-0.1750,-78.4600', 'mapa')">
            <h3>LORA 3 (Ver Mapa)</h3>
            <p>Ubicación: Sur</p>
        </div>

        <div class="dispositivo-card" onclick="alert('Este dispositivo no cuenta con módulo GPS activo.')">
            <h3>Lilygo 1</h3>
            <p>Estado: Conectado</p>
        </div>

        <div class="dispositivo-card" onclick="alert('Este dispositivo no cuenta con módulo GPS activo.')">
            <h3>Lilygo 2</h3>
            <p>Estado: Conectado</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="https://maps.google.com/maps?q=-0.1807,-78.4678&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>

    <script>
        // Función para actualizar el mapa/streetview sin recargar la página
        function cambiarUbicacion(coordenadas, tipo) {
            const iframe = document.getElementById('map-frame');
            
            if (tipo === 'mapa') {
                // Genera el mapa estándar centrado en las coordenadas
                iframe.src = `https://maps.google.com/maps?q=${coordenadas}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
            } else if (tipo === 'streetview') {
                // Activa la vista de Street View (satélite/calle si está disponible) en esas coordenadas
                iframe.src = `https://maps.google.com/maps?q=${coordenadas}&layer=c&cbll=${coordenadas}&cbp=12,0,0,0,0&source=browser&ie=UTF8&output=embed`;
            }
        }
    </script>
</body>
</html>
