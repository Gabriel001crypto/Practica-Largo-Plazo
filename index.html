<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel LoRa - Solo Paquetes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 6px solid #22c55e;
        }

        .card h2 {
            font-size: 1.4rem;
            color: #f1f5f9;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            margin-top: 15px;
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric span.label {
            color: #94a3b8;
            font-size: 1rem;
        }

        .metric span.value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #22c55e;
        }

        .status-online {
            width: 12px;
            height: 12px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body>

    <h1>📡 Monitoreo de Paquetes LoRa</h1>
    <p class="subtitle">Panel de Control Simplificado - Sin Mapas</p>

    <div id="dashboard">
        <div class="card">
            <h2><span class="status-online"></span> GABRIEL</h2>
            <div class="metric">
                <span class="label">Paquetes:</span>
                <span class="value" id="p-gabriel">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #a855f7;">
            <h2><span class="status-online"></span> JIMMY LORA 32</h2>
            <div class="metric">
                <span class="label">Paquetes:</span>
                <span class="value" id="p-jimmy" style="color: #a855f7;">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #f97316;">
            <h2><span class="status-online"></span> AUGUSTO HELTEC</h2>
            <div class="metric">
                <span class="label">Paquetes:</span>
                <span class="value" id="p-augusto" style="color: #f97316;">0</span>
            </div>
        </div>
    </div>

    <script>
        // Función encargada de romper la cadena "Sensor=Activo,Paquete=193" y sacar solo el número
        function extraerPaquete(nodo) {
            if (!nodo) return '0';
            
            // Si ya viene como número puro
            if (nodo.paquetes !== undefined && nodo.paquetes !== "") {
                return nodo.paquetes;
            }
            
            // Si viene de TagoIO como texto largo en "estado", "info" o "datos"
            const textoLargo = nodo.estado || nodo.info || nodo.datos || '';
            const coincidencia = textoLargo.match(/Paquete=(\d+)/);
            
            return coincidencia ? coincidencia[1] : '0';
        }

        async function cargarDatos() {
            try {
                // Buscamos el archivo datos.json con un número aleatorio para evitar la caché
                const respuesta = await fetch('./datos.json?v=' + Math.random());
                const datos = await respuesta.json();
                
                // Mapeamos de forma elástica buscando tanto minúsculas como mayúsculas
                const nodoGabriel = datos.Gabriel || datos.GABRIEL || datos.lora1;
                const nodoJimmy = datos.JimmyLora32 || datos.lora2;
                const nodoAugusto = datos.AUGUSTO_HELTEC || datos.lora3;

                // Insertamos los valores procesados en la pantalla
                document.getElementById('p-gabriel').innerText = extraerPaquete(nodoGabriel);
                document.getElementById('p-jimmy').innerText = extraerPaquete(nodoJimmy);
                document.getElementById('p-augusto').innerText = extraerPaquete(nodoAugusto);

            } catch (e) {
                console.log("Sincronizando con TagoIO...");
            }
        }

        // Ejecutar al abrir y refrescar cada 2 segundos
        cargarDatos();
        setInterval(cargarDatos, 2000);
    </script>
</body>
</html>
