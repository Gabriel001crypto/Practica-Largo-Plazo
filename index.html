<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Nodos IoT - Capa de Aplicación</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        #sidebar {
            width: 300px;
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        #sidebar h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
        }

        .dispositivo-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dispositivo-card:hover {
            background-color: #475569;
        }

        .dispositivo-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .dispositivo-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        #map-container {
            flex-grow: 1;
            height: 100%;
        }

        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Dispositivos Activos</h2>
        
        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora1', 'mapa')">
            <h3>LORA 1 (Ver Mapa)</h3>
            <p id="lora1-info">Cargando datos...</p>
        </div>
        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora1', 'streetview')">
            <h3>LORA 1 (Street View)</h3>
            <p>Vista de calle interactiva</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora2', 'mapa')">
            <h3>LORA 2 (Ver Mapa)</h3>
            <p id="lora2-info">Cargando datos...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora3', 'mapa')">
            <h3>LORA 3 (Ver Mapa)</h3>
            <p id="lora3-info">Cargando datos...</p>
        </div>

        <div class="dispositivo-card">
            <h3>Lilygo 1</h3>
            <p id="lily1-info">Estado: --</p>
        </div>

        <div class="dispositivo-card">
            <h3>Lilygo 2</h3>
            <p id="lily2-info">Estado: --</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
    </div>

    <script>
        let datosSensores = {};

        // Función para consumir el archivo JSON de tu repositorio
        async function obtenerDatos() {
            try {
                // Al usar './datos.json' lee el archivo que está en tu mismo GitHub Pages
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime()); // El token evita el caché
                datosSensores = await respuesta.json();
                
                // Actualizar los textos del panel lateral con los datos reales del JSON
                document.getElementById('lora1-info').innerText = datosSensores.lora1.info + " [" + datosSensores.lora1.coordenadas + "]";
                document.getElementById('lora2-info').innerText = datosSensores.lora2.info + " [" + datosSensores.lora2.coordenadas + "]";
                document.getElementById('lora3-info').innerText = datosSensores.lora3.info + " [" + datosSensores.lora3.coordenadas + "]";
                document.getElementById('lily1-info').innerText = "Estado: " + datosSensores.lily1.estado + " | Bat: " + datosSensores.lily1.bateria;
                document.getElementById('lily2-info').innerText = "Estado: " + datosSensores.lily2.estado + " | Bat: " + datosSensores.lily2.bateria;

            } catch (error) {
                console.error("Error leyendo el archivo de datos:", error);
            }
        }

        // Función que interactúa con el iframe interactivo de Google Maps
        function cargarUbicacionNodo(id, tipo) {
            const iframe = document.getElementById('map-frame');
            if (datosSensores[id] && datosSensores[id].coordenadas) {
                const coord = datosSensores[id].coordenadas;
                if (tipo === 'mapa') {
                    iframe.src = `https://maps.google.com/maps?q=${coord}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
                } else if (tipo === 'streetview') {
                    iframe.src = `https://maps.google.com/maps?q=${coord}&layer=c&cbll=${coord}&cbp=12,0,0,0,0&source=browser&ie=UTF8&output=embed`;
                }
            } else {
                alert("Este dispositivo no cuenta con coordenadas de localización.");
            }
        }

        // Cargar datos inmediatamente al abrir la página
        obtenerDatos();
        
        // Revisar si hay nuevos datos automáticamente cada 5 segundos
        setInterval(obtenerDatos, 5000);
    </script>
</body>
</html>
