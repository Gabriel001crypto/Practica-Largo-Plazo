<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Nodos IoT - Capa de Aplicación</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        #sidebar {
            width: 320px;
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        #sidebar h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .dispositivo-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .dispositivo-card:hover {
            background-color: #475569;
            transform: scale(1.02);
        }

        .dispositivo-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .dispositivo-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 3px;
        }

        #map-container {
            flex-grow: 1;
            height: 100%;
        }

        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Dispositivos Activos</h2>
        
        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora1', 'mapa')">
            <h3>LORA 1 (Ver Mapa)</h3>
            <p id="lora1-info">Cargando...</p>
        </div>
        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora1', 'streetview')">
            <h3>LORA 1 (Street View)</h3>
            <p>Ver entorno real de calle</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora2', 'mapa')">
            <h3>LORA 2 (Ver Mapa)</h3>
            <p id="lora2-info">Cargando...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora3', 'mapa')">
            <h3>LORA 3 (Ver Mapa)</h3>
            <p id="lora3-info">Cargando...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lily1', 'mapa')">
            <h3>Lilygo 1 (Ver Mapa)</h3>
            <p id="lily1-info">Cargando...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lily2', 'mapa')">
            <h3>Lilygo 2 (Ver Mapa)</h3>
            <p id="lily2-info">Cargando...</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
    </div>

    <script>
        let datosSensores = {};

        // Función para leer el JSON real de tu repositorio
        async function obtenerDatos() {
            try {
                // Hacemos la petición al archivo datos.json agregando un número aleatorio para evitar que el navegador guarde caché viejo
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime());
                datosSensores = await respuesta.json();
                
                // Pintamos los datos reales del JSON en las tarjetas del panel lateral
                document.getElementById('lora1-info').innerHTML = `Coord: ${datosSensores.lora1.coordenadas}<br><em>${datosSensores.lora1.info}</em>`;
                document.getElementById('lora2-info').innerHTML = `Coord: ${datosSensores.lora2.coordenadas}<br><em>${datosSensores.lora2.info}</em>`;
                document.getElementById('lora3-info').innerHTML = `Coord: ${datosSensores.lora3.coordenadas}<br><em>${datosSensores.lora3.info}</em>`;
                
                document.getElementById('lily1-info').innerHTML = `Coord: ${datosSensores.lily1.coordenadas}<br>Est: ${datosSensores.lily1.estado} | Bat: ${datosSensores.lily1.bateria}`;
                document.getElementById('lily2-info').innerHTML = `Coord: ${datosSensores.lily2.coordenadas}<br>Est: ${datosSensores.lily2.estado} | Bat: ${datosSensores.lily2.bateria}`;

            } catch (error) {
                console.error("Error leyendo el archivo JSON:", error);
            }
        }

        // Función para renderizar el mapa dinámicamente con la variable correcta (${coord})
        function cargarUbicacionNodo(id, tipo) {
            const iframe = document.getElementById('map-frame');
            
            if (datosSensores[id] && datosSensores[id].coordenadas) {
                const coord = datosSensores[id].coordenadas;
                
                if (tipo === 'mapa') {
                    // Carga el mapa de Google estándar con las coordenadas reales
                    iframe.src = `https://maps.google.com/maps?q=${coord}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
                } else if (tipo === 'streetview') {
                    // Carga el entorno de Street View interactivo real
                    iframe.src = `https://maps.google.com/maps?q=${coord}&layer=c&cbll=${coord}&cbp=12,0,0,0,0&source=browser&ie=UTF8&output=embed`;
                }
            } else {
                alert("Este dispositivo no tiene coordenadas válidas en el JSON.");
            }
        }

        // Ejecución automática al cargar la web
        obtenerDatos();
        
        // Refrescar datos automáticamente en segundo plano cada 4 segundos
        setInterval(obtenerDatos, 4000);
    </script>
</body>
</html>
