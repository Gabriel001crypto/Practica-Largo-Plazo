<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo LoRa - Solo Datos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 6px solid #22c55e;
        }
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        .metric {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric .value {
            font-size: 2.3rem;
            font-weight: bold;
            color: #22c55e;
        }
    </style>
</head>
<body>

    <h1>📡 Monitoreo de Paquetes LoRa</h1>
    <p class="subtitle">Panel de Control General - Extracción desde TagoIO</p>

    <div id="dashboard">
        <div class="card">
            <h2>🟢 NODO: GABRIEL</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-gabriel">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #a855f7;">
            <h2>🟢 NODO: JIMMY LORA 32</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-jimmy" style="color: #a855f7;">0</span>
            </div>
        </div>

        <div class="card" style="border-top-color: #f97316;">
            <h2>🟢 NODO: AUGUSTO HELTEC</h2>
            <div class="metric">
                <span>Paquetes:</span>
                <span class="value" id="p-augusto" style="color: #f97316;">0</span>
            </div>
        </div>
    </div>

    <script>
        // Súper extractor de paquetes: busca en cualquier rincón del objeto de TagoIO
        function procesarDatoTago(nodo) {
            if (!nodo) return '0';
            
            // 1. Si viene como un número directo en la variable paquetes
            if (nodo.paquetes !== undefined && nodo.paquetes !== "") return nodo.paquetes;
            
            // 2. Une todos los textos posibles donde TagoIO guarda información
            const textoLargo = "" + (nodo.estado || "") + " " + (nodo.info || "") + " " + (nodo.datos || "");
            
            // 3. Intenta buscar el patrón exacto "Paquete=XYZ" del Live Inspector
            const regexPaquete = textoLargo.match(/Paquete=(\d+)/);
            if (regexPaquete) return regexPaquete[1];
            
            // 4. Si TagoIO manda la cadena en otro orden, extrae cualquier número válido
            const regexNumeroSuelto = textoLargo.match(/\d+/);
            return regexNumeroSuelto ? regexNumeroSuelto[0] : '0';
        }

        async function solicitarDatos() {
            try {
                // Petición rompiendo la caché del navegador para ver cambios en vivo
                const res = await fetch('./datos.json?nocache=' + new Date().getTime());
                const info = await res.json();

                // Mapeo Ultra-Flexible: Busca por ID genérico (lora1) o por nombre (Gabriel)
                const g = info.lora1 || info.Gabriel || info.GABRIEL;
                const j = info.lora2 || info.JimmyLora32 || info.jimmyData;
                const a = info.lora3 || info.AUGUSTO_HELTEC || info.augustoData;

                // Actualizar los textos de la interfaz web
                document.getElementById('p-gabriel').innerText = procesarDatoTago(g);
                document.getElementById('p-jimmy').innerText = procesarDatoTago(j);
                document.getElementById('p-augusto').innerText = procesarDatoTago(a);
            } catch (err) {
                console.log("Sincronizando flujos de TagoIO...");
            }
        }

        // Ejecución inmediata y actualización cada 2 segundos
        solicitarDatos();
        setInterval(solicitarDatos, 2000);
    </script>
</body>
</html>
