<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Nodos IoT - Capa de Aplicación</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }

        #sidebar {
            width: 320px;
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        #sidebar h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .dispositivo-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        /* Diseño destacado para tu tarjeta real */
        .nodo-real-card {
            background-color: #0f172a;
            border-left: 5px solid #22c55e;
        }

        .dispositivo-card:hover {
            background-color: #475569;
            transform: scale(1.02);
        }

        .dispositivo-card h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .nodo-real-card h3 {
            color: #22c55e;
        }

        .dispositivo-card p {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 3px;
            line-height: 1.3rem;
        }

        #map-container {
            flex-grow: 1;
            height: 100%;
        }

        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Transmisión Real LoRa</h2>
        
        <div class="dispositivo-card nodo-real-card" onclick="cargarUbicacionNodo('Gabriel')">
            <h3>📡 Nodo: GABRIEL</h3>
            <p id="gabriel-info">Esperando datos del T-Beam...</p>
        </div>

        <h2>Simuladores de Respaldo</h2>
        
        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora1')">
            <h3>LORA 1</h3>
            <p id="lora1-info">Cargando...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lora2')">
            <h3>LORA 2</h3>
            <p id="lora2-info">Cargando...</p>
        </div>

        <div class="dispositivo-card" onclick="cargarUbicacionNodo('lily1')">
            <h3>Lilygo Estática 1</h3>
            <p id="lily1-info">Cargando...</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
    </div>

    <script>
        let datosSensores = {};

        async function obtenerDatos() {
            try {
                // Hacemos el fetch al JSON rompiendo el caché del navegador
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime());
                datosSensores = await respuesta.json();
                
                // 1. Inyectamos los datos del receptor de tu compañero para tu nodo
                if (datosSensores.Gabriel) {
                    document.getElementById('gabriel-info').innerHTML = `
                        <strong>Estado:</strong> ${datosSensores.Gabriel.estado || 'Activo'}<br>
                        <strong>Paquetes:</strong> ${datosSensores.Gabriel.paquetes || '0'}<br>
                        <strong>Calidad RSSI:</strong> ${datosSensores.Gabriel.rssi || '--'} dBm<br>
                        <span style="color:#22c55e; font-size:0.75rem;">Ubicación: ${datosSensores.Gabriel.coordenadas}</span>
                    `;
                }

                // 2. Datos complementarios de la lista
                document.getElementById('lora1-info').innerText = `Coord: ${datosSensores.lora1?.coordenadas || '0.0,0.0'}`;
                document.getElementById('lora2-info').innerText = `Coord: ${datosSensores.lora2?.coordenadas || '0.0,0.0'}`;
                document.getElementById('lily1-info').innerText = `Coord: ${datosSensores.lily1?.coordenadas || '0.0,0.0'}`;

            } catch (error) {
                console.error("Error al procesar los datos JSON de los dispositivos:", error);
            }
        }

        function cargarUbicacionNodo(id) {
            const iframe = document.getElementById('map-frame');
            
            if (datosSensores[id] && datosSensores[id].coordenadas) {
                const coord = datosSensores[id].coordenadas;
                
                // Si está en 0.0,0.0 alertamos que falta el GPS
                if(coord === "0.0,0.0" || coord === "0,0") {
                    alert("El nodo no ha adquirido coordenadas válidas del satélite aún.");
                    return;
                }
                
                // Renderizado dinámico del mapa sin errores de API Key
                iframe.src = `https://maps.google.com/maps?q=${coord}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
            } else {
                alert("Este dispositivo no se encuentra registrado en el JSON.");
            }
        }

        // Ejecución automática inicial y refresco cada 4 segundos
        obtenerDatos();
        setInterval(obtenerDatos, 4000);
    </script>
</body>
</html>
