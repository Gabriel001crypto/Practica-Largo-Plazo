<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo LoRa - Paquetes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 6px solid #22c55e;
            transition: transform 0.2s;
        }

        .card h2 {
            font-size: 1.4rem;
            color: #f1f5f9;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            margin-top: 15px;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric span.label {
            color: #94a3b8;
            font-size: 1rem;
        }

        .metric span.value {
            font-size: 2rem;
            font-weight: bold;
            color: #22c55e;
        }

        .status-online {
            width: 12px;
            height: 12px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body>

    <h1>📡 Monitoreo de Paquetes LoRa</h1>
    <p class="subtitle">Capa de Aplicación - Dispositivos detectados en tiempo real</p>

    <div id="dashboard" id="contenedor-nodos">
        <!-- Tarjeta Dispositivo: Gabriel -->
        <div class="card">
            <h2><span class="status-online"></span> GABRIEL</h2>
            <div class="metric">
                <span class="label">Paquetes Recibidos:</span>
                <span class="value" id="p-gabriel">0</span>
            </div>
        </div>

        <!-- Tarjeta Dispositivo: JimmyLora32 -->
        <div class="card" style="border-top-color: #a855f7;">
            <h2><span class="status-online"></span> JIMMY LORA 32</h2>
            <div class="metric">
                <span class="label">Paquetes Recibidos:</span>
                <span class="value" id="p-jimmy" style="color: #a855f7;">0</span>
            </div>
        </div>

        <!-- Tarjeta Dispositivo: Augusto -->
        <div class="card" style="border-top-color: #f97316;">
            <h2><span class="status-online"></span> AUGUSTO HELTEC</h2>
            <div class="metric">
                <span class="label">Paquetes Recibidos:</span>
                <span class="value" id="p-augusto" style="color: #f97316;">0</span>
            </div>
        </div>
    </div>

    <script>
        async function actualizarPaquetes() {
            try {
                // Hacemos el fetch al JSON rompiendo el caché del navegador
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime());
                const datos = await respuesta.json();

                // Extraer y mostrar paquetes de Gabriel
                if (datos.Gabriel) {
                    document.getElementById('p-gabriel').innerText = datos.Gabriel.paquetes || '0';
                }

                // Extraer y mostrar paquetes de JimmyLora32
                if (datos.JimmyLora32) {
                    document.getElementById('p-jimmy').innerText = datos.JimmyLora32.paquetes || '0';
                }

                // Extraer y mostrar paquetes de AUGUSTO_HELTEC
                if (datos.AUGUSTO_HELTEC) {
                    document.getElementById('p-augusto').innerText = datos.AUGUSTO_HELTEC.paquetes || '0';
                }

            } catch (error) {
                console.error("Esperando datos de la API de TagoIO...", error);
            }
        }

        // Revisar cambios automáticamente cada 3 segundos
        actualizarPaquetes();
        setInterval(actualizarPaquetes, 3000);
    </script>
</body>
</html>
