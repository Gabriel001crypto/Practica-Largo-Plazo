<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo LoRa - Tiempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; }
        #sidebar { width: 320px; background-color: #1e293b; color: #ffffff; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        #sidebar h2 { font-size: 1.2rem; border-bottom: 2px solid #22c55e; padding-bottom: 10px; }
        .dispositivo-card { background-color: #0f172a; padding: 15px; border-radius: 8px; border-left: 5px solid #22c55e; }
        .dispositivo-card h3 { font-size: 1rem; color: #22c55e; margin-bottom: 5px; }
        .dispositivo-card p { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4rem; }
        #map-container { flex-grow: 1; height: 100%; }
        #map-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Ubicación en Tiempo Real</h2>
        <div class="dispositivo-card">
            <h3>📡 Nodo: GABRIEL</h3>
            <p id="gabriel-info">Esperando primera transmisión GPS...</p>
        </div>
    </div>

    <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
    </div>

    <script>
        let ultimaCoordenada = "";

        async function obtenerDatosTiempoReal() {
            try {
                // Leemos el JSON rompiendo el caché para asegurar el tiempo real
                const respuesta = await fetch('./datos.json?t=' + new Date().getTime());
                const datos = await respuesta.json();
                
                if (datos.Gabriel) {
                    const coord = datos.Gabriel.coordenadas;
                    const paquetes = datos.Gabriel.paquetes || '0';
                    const rssi = datos.Gabriel.rssi || '0';
                    const estado = datos.Gabriel.estado || 'Activo';

                    // Actualizamos el panel lateral en vivo
                    document.getElementById('gabriel-info').innerHTML = `
                        <strong>Estado:</strong> ${estado}<br>
                        <strong>Paquetes Recibidos:</strong> ${paquetes}<br>
                        <strong>Señal RSSI:</strong> ${rssi} dBm<br>
                        <span style="color:#38bdf8; font-size:0.8rem;">Coordenadas: ${coord}</span>
                    `;

                    // Si la coordenada cambió en GitHub, movemos el mapa inmediatamente
                    if (coord && coord !== "0.0,0.0" && coord !== ultimaCoordenada) {
                        ultimaCoordenada = coord;
                        document.getElementById('map-frame').src = `https://maps.google.com/maps?q=${coord}&t=&z=17&ie=UTF8&iwloc=&output=embed`;
                    }
                }
            } catch (error) {
                console.error("Esperando actualización de TagoIO...", error);
            }
        }

        // Ejecutar al cargar la página y revisar cambios automáticamente cada 3 segundos
        obtenerDatosTiempoReal();
        setInterval(obtenerDatosTiempoReal, 3000);
    </script>
</body>
</html>
